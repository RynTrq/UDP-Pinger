[metadata]
name = udp-pinger
version = 1.0.0
description = A production-minded UDP ping client and packet-loss simulation server.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = UDP Pinger Maintainers

[options]
packages = find:
python_requires = >=3.9
install_requires =

[options.packages.find]
include = udp_pinger*

[options.entry_points]
console_scripts =
    udp-pinger = udp_pinger.cli:main

